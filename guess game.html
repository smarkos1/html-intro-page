<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Number Guessing Game</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.game-box{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    width:320px;
}

h1{
    margin-bottom:10px;
    color:#333;
}

p{
    font-size:14px;
    color:#555;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#00c6ff;
}

</style>

</head>

<body>

<div class="game-box">

<h1>Guessing Game</h1>

<p>
Try to guess the number between 1 and 10.<br>
You have 3 attempts.
</p>

<button onclick="startGame()">Start Game</button>

</div>

<script src="script.js"></script>

</body>
</html>
